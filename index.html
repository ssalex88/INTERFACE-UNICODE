<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NUTRIA · bienestar preventivo, en tu propio dispositivo</title>
  <meta name="description" content="NUTRIA convierte una frase suelta en un registro de hábitos. Todo se interpreta dentro de tu navegador: tu texto nunca llega a un servidor.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#090d12" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="./css/estilos.css">
  <link rel="icon" type="image/png" href="./inicial-nutria.png">
</head>
<body>
  <a class="salto" href="#vista">Saltar al contenido</a>

  <!-- Lienzo ambiental: dos lavados de color y un grano de papel. Decorativo. -->
  <div class="lienzo" aria-hidden="true"></div>

  <header class="cabecera" data-scroll="no">
    <div class="cabecera__interior">
      <a class="marca" href="#vista">
        <span class="marca__sello" aria-hidden="true">
          <img src="./inicial-nutria.png" alt="Logo NUTRIA" class="marca__logo-img">
        </span>
        <span>
          <span class="marca__nombre">NUTRIA</span>
          <span class="marca__bajada">Health OS · ULima</span>
        </span>
      </a>

      <button class="boton boton--secundario" type="button" data-accion="ir" data-vista="informe" style="font-size:.82rem;padding:.38rem .8rem;font-weight:600;">
        Mi informe
      </button>
    </div>
  </header>

  <main id="vista" class="contenido" tabindex="-1">
    <div class="cargando">Cargando…</div>
  </main>

  <nav class="tabs" aria-label="Secciones">
    <!-- Marca y pie: solo visibles cuando la barra se vuelve riel de escritorio -->
    <div class="riel-marca" aria-hidden="true">
      <span class="marca__sello">
        <img src="./inicial-nutria.png" alt="Logo NUTRIA" class="marca__logo-img">
      </span>
      <span>
        <span class="marca__nombre">NUTRIA</span>
        <span class="marca__bajada">Health OS · ULima</span>
      </span>
    </div>

    <span class="tabs__indicador" aria-hidden="true"></span>

    <button class="tabs__boton tabs__boton--activo" data-vista="hoy">
      <span class="tabs__icono" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 20l1.2-4.2L15.6 5.4a2 2 0 0 1 2.8 0l.2.2a2 2 0 0 1 0 2.8L8.2 18.8 4 20Z"/>
          <path d="M13.8 7.2l3 3"/>
        </svg>
      </span>
      <span class="tabs__texto">Hoy</span>
    </button>

    <button class="tabs__boton" data-vista="patrones">
      <span class="tabs__icono" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 15.5c2.2 0 2.4-7 4.6-7s2.2 9 4.4 9 2.4-8 4.6-8 2.1 4.5 4.4 4.5"/>
        </svg>
      </span>
      <span class="tabs__texto">Patrones</span>
    </button>

    <button class="tabs__boton" data-vista="historial">
      <span class="tabs__icono" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.2 6.4h4M4.2 12h4M4.2 17.6h4"/>
          <path d="M11.4 6.4h8.4M11.4 12h8.4M11.4 17.6h5.4"/>
        </svg>
      </span>
      <span class="tabs__texto">Historial</span>
    </button>

    <button class="tabs__boton" data-vista="comida">
      <span class="tabs__icono" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.2 10.5h17.6a8.8 8.8 0 0 1-8.8 8.5 8.8 8.8 0 0 1-8.8-8.5Z"/>
          <path d="M9 7.2c0-1.3 1.4-1.5 1.4-2.7M13.2 7.2c0-1.6 1.6-1.8 1.6-3.2"/>
        </svg>
      </span>
      <span class="tabs__texto">Comida</span>
    </button>

    <button class="tabs__boton" data-vista="comunidad">
      <span class="tabs__icono" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="8.6" r="3.1"/>
          <path d="M3.6 19.4a5.4 5.4 0 0 1 10.8 0"/>
          <path d="M16 6.1a3 3 0 0 1 0 5.6M17.4 14.6a5.2 5.2 0 0 1 3 4.8"/>
        </svg>
      </span>
      <span class="tabs__texto">Comunidad</span>
    </button>

    <button class="tabs__boton" data-vista="perfil">
      <span class="tabs__icono" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8.2" r="3.6"/>
          <path d="M4.8 20.2a7.2 7.2 0 0 1 14.4 0"/>
        </svg>
      </span>
      <span class="tabs__texto">Perfil</span>
    </button>

    <div class="riel-pie">
      <button class="boton boton--secundario" type="button" data-accion="ir" data-vista="informe" style="width:100%;font-size:.82rem;padding:.4rem .75rem;font-weight:600;margin-bottom:.5rem;">
        Mi informe
      </button>
      <p>Lo que escribes se queda en este dispositivo. Nadie más lo ve.</p>
    </div>
  </nav>

  <!-- Nutri vive fuera de #vista: no se repinta ni pierde su panel al cambiar de pestaña. -->
  <div id="nutri"></div>

  <div id="aviso-flotante" class="aviso-flotante" role="status" aria-live="polite"></div>

  <noscript>
    <div class="contenido">
      <div class="aviso aviso--atencion">
        NUTRIA necesita JavaScript para funcionar. Actívalo y vuelve a cargar la página.
      </div>
    </div>
  </noscript>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
