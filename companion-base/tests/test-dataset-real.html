<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NUTRIA · integración dataset real</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 1.5rem; background: #0d1413; color: #e8f0ef; }
    .resumen { padding: .7rem 1rem; border-radius: 10px; margin: .8rem 0 1rem; font-weight: 700; }
    .verde { background: #052e16; color: #4ade80; } .rojo { background: #450a0a; color: #fca5a5; }
    li { margin: .45rem 0; } pre { padding: .8rem; background: #1d2a28; overflow: auto; }
  </style>
</head>
<body>
  <h1>Integración del dataset real · HU-07 + HU-08</h1>
  <div id="resumen">Cargando CSV…</div>
  <ul id="salida"></ul>
  <pre id="detalle"></pre>

  <script type="module">
    import { cargarDatasetReal } from '../js/datos/dataset-real.js';
    import { evaluateCompatibility } from '../js/motor/compatibilidad.js';
    import { recommendFood } from '../js/motor/recomendador.js';

    const salida = document.querySelector('#salida');
    const resumen = document.querySelector('#resumen');
    const detalle = document.querySelector('#detalle');
    try {
      const dataset = await cargarDatasetReal();
      const ejemplo = dataset.options[0];
      const perfilNeutral = {};
      const perfilAlergia = { restrictions: { peanut: { allergy: 'known' } } };
      const perfilVegetariano = { vegetarian: true };
      const compatWarning = evaluateCompatibility(perfilAlergia, ejemplo);
      const compatExcluded = evaluateCompatibility(perfilVegetariano, { ...ejemplo, vegetarian: false });
      const compatEligible = evaluateCompatibility(perfilNeutral, ejemplo);
      const ranking = recommendFood({
        options: dataset.options,
        profile: perfilNeutral,
        context: { campusId: 'ulima', budget: 12, availableMinutes: 20 }
      });
      const checks = [
        ['carga 20 restaurantes', dataset.restaurants.length === 20],
        ['carga 65 platos', dataset.options.length === 65],
        ['une restaurantId válido', dataset.options.every((dish) => dataset.restaurants.some((r) => r.id === dish.restaurantId))],
        ['conserva waitMinutes unknown', ejemplo.waitMinutes === null],
        ['HU-07 produce warning con alérgeno desconocido', compatWarning.status === 'warning'],
        ['HU-07 produce excluded por vegetarian', compatExcluded.status === 'excluded'],
        ['HU-07 produce eligible sin restricciones', compatEligible.status === 'eligible'],
        ['HU-08 devuelve ranking real', ranking.recommendations.length > 0 && ranking.recommendations.every((r) => r.razones.length > 0)]
      ];
      let pasadas = 0;
      for (const [nombre, ok] of checks) {
        if (ok) pasadas++;
        const li = document.createElement('li');
        li.textContent = `${ok ? 'OK' : 'FALLA'} · ${nombre}`;
        li.style.color = ok ? '#4ade80' : '#fca5a5';
        salida.append(li);
      }
      resumen.textContent = `${pasadas}/${checks.length} verificaciones · restaurantes: ${dataset.restaurants.length} · platos: ${dataset.options.length}`;
      resumen.className = `resumen ${pasadas === checks.length ? 'verde' : 'rojo'}`;
      detalle.textContent = JSON.stringify({
        platoReal: ejemplo,
        compatibilidad: { eligible: compatEligible, warning: compatWarning, excluded: compatExcluded },
        excludedEnRanking: ranking.excluded,
        rankingFinal: ranking.recommendations.map((r) => ({ id: r.opcion.id, plato: r.opcion.plato, status: r.compatibilidad.status, puntaje: r.puntajeContextual, razones: r.razones }))
      }, null, 2);
    } catch (error) {
      resumen.textContent = `ERROR: ${error.message}`;
      resumen.className = 'resumen rojo';
    }
  </script>
</body>
</html>
