<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NUTRIA · pruebas HU-07</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 1.5rem; background: #0d1413; color: #e8f0ef; }
    h1 { margin: 0 0 .4rem; } .resumen { padding: .7rem 1rem; border-radius: 10px; margin: .8rem 0 1rem; font-weight: 700; }
    .verde { background: #052e16; color: #4ade80; } .rojo { background: #450a0a; color: #fca5a5; }
    table { width: 100%; border-collapse: collapse; } td, th { border-bottom: 1px solid #253634; padding: .4rem .5rem; text-align: left; }
    .ok { color: #4ade80; } .fail { color: #fca5a5; }
  </style>
</head>
<body>
  <h1>Pruebas del motor de compatibilidad · HU-07</h1>
  <p>Mocks locales; no usa el dataset real ni dependencias externas.</p>
  <div id="resumen" class="resumen">Ejecutando…</div>
  <table><thead><tr><th>Estado</th><th>Caso</th><th>Esperado</th><th>Obtenido</th></tr></thead><tbody id="salida"></tbody></table>

  <script type="module">
    import { evaluateCompatibility } from '../js/motor/compatibilidad.js';

    const casos = [
      {
        nombre: 'A · alergia conocida + contiene peanut',
        perfil: { restrictions: { peanut: { allergy: 'known' } } },
        plato: { contains: { peanut: 'known' } }, esperado: 'excluded'
      },
      {
        nombre: 'B · alergia conocida + mayContain peanut',
        perfil: { restrictions: { peanut: { allergy: 'known' } } },
        plato: { mayContain: { peanut: 'known' } }, esperado: 'excluded'
      },
      {
        nombre: 'alergia conocida + información desconocida',
        perfil: { restrictions: { peanut: { allergy: 'known' } } },
        plato: { contains: { peanut: 'unknown' } }, esperado: 'warning'
      },
      {
        nombre: 'intolerancia conocida + incompatibilidad conocida',
        perfil: { restrictions: { lactose: { intolerance: 'known' } } },
        plato: { contains: { lactose: 'known' } }, esperado: 'excluded'
      },
      {
        nombre: 'preferencia vegetariana + plato no vegetariano',
        perfil: { vegetarian: true }, plato: { vegetarian: false }, esperado: 'excluded'
      },
      {
        nombre: 'preferencia vegetariana + estado desconocido',
        perfil: { vegetarian: true }, plato: {}, esperado: 'warning'
      },
      {
        nombre: 'not_applicable no genera conflicto',
        perfil: { restrictions: { gluten: { allergy: 'known' } } },
        plato: { contains: { gluten: 'not_applicable' } }, esperado: 'eligible'
      },
      {
        nombre: 'unknown irrelevante sin restricción',
        perfil: {}, plato: { contains: { gluten: 'unknown' } }, esperado: 'eligible'
      },
      {
        nombre: 'excluded tiene prioridad sobre warning',
        perfil: { restrictions: { peanut: { allergy: 'known' }, lactose: { allergy: 'known' } } },
        plato: { contains: { peanut: 'known', lactose: 'unknown' } }, esperado: 'excluded'
      },
      {
        nombre: 'varias razones se conservan',
        perfil: { vegetarian: true, restrictions: { peanut: { allergy: 'known' } } },
        plato: { vegetarian: false, contains: { peanut: 'known' } }, esperado: 'excluded',
        validar: (resultado) => resultado.reasons.length >= 2
      }
    ];

    const salida = document.querySelector('#salida');
    let pasadas = 0;
    for (const caso of casos) {
      const obtenido = evaluateCompatibility(caso.perfil, caso.plato);
      const ok = obtenido.status === caso.esperado && (!caso.validar || caso.validar(obtenido));
      if (ok) pasadas++;
      const fila = document.createElement('tr');
      fila.innerHTML = `<td class="${ok ? 'ok' : 'fail'}">${ok ? 'OK' : 'FALLA'}</td><td>${caso.nombre}</td><td>${caso.esperado}</td><td>${obtenido.status}</td>`;
      salida.append(fila);
    }
    const resumen = document.querySelector('#resumen');
    resumen.textContent = `${pasadas}/${casos.length} casos correctos`;
    resumen.className = `resumen ${pasadas === casos.length ? 'verde' : 'rojo'}`;
  </script>
</body>
</html>
