<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NUTRIA · pruebas HU-08</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 1.5rem; background: #0d1413; color: #e8f0ef; }
    .resumen { padding: .7rem 1rem; border-radius: 10px; margin: .8rem 0 1rem; font-weight: 700; }
    .verde { background: #052e16; color: #4ade80; } .rojo { background: #450a0a; color: #fca5a5; }
    li { margin: .45rem 0; } code { background: #1d2a28; padding: .1rem .3rem; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Pruebas del recomendador contextual · HU-08</h1>
  <div id="resumen">Ejecutando…</div>
  <ul id="salida"></ul>

  <script type="module">
    import { recommendFood } from '../js/motor/recomendador.js';
    import { evaluateCompatibility } from '../js/motor/compatibilidad.js';

    const contexto = { campusId: 'ulima', budget: 12, availableMinutes: 20 };
    const plato = (extra = {}) => ({ campusId: 'ulima', vegetarian: true, ...extra });
    const perfil = { restrictions: { peanut: { allergy: 'known' } } };
    const seguro = plato({ id: 'seguro', price: 10, walkMinutes: 5, waitMinutes: 7, contains: { peanut: 'not_applicable' } });

    const caso1 = recommendFood({ options: [seguro], profile: perfil, context: contexto });
    const excludedDish = plato({ id: 'alergia', price: 6, walkMinutes: 2, waitMinutes: 2, contains: { peanut: 'known' } });
    const caso2 = recommendFood({ options: [excludedDish], profile: perfil, context: contexto });
    const warningDish = plato({ id: 'warning', price: 9, walkMinutes: 4, waitMinutes: 4, contains: { peanut: 'unknown' } });
    const caso3 = recommendFood({ options: [warningDish], profile: perfil, context: contexto });
    const caso4 = recommendFood({ options: [plato({ id: 'caro', price: 15, walkMinutes: 2, waitMinutes: 2, contains: { peanut: 'not_applicable' } })], profile: perfil, context: contexto });
    const caso5 = recommendFood({ options: [plato({ id: 'viable', price: 10, walkMinutes: 5, waitMinutes: 10, contains: { peanut: 'not_applicable' } })], profile: perfil, context: contexto });
    const caso6 = recommendFood({ options: [plato({ id: 'lento', price: 10, walkMinutes: 10, waitMinutes: 15, contains: { peanut: 'not_applicable' } })], profile: perfil, context: contexto });
    const rankingOptions = [
      plato({ id: 'A', price: 11, walkMinutes: 5, waitMinutes: 5, contains: { peanut: 'not_applicable' } }),
      plato({ id: 'B', price: 9, walkMinutes: 10, waitMinutes: 8, contains: { peanut: 'not_applicable' } })
    ];
    const caso7 = recommendFood({ options: rankingOptions, profile: perfil, context: contexto });
    const caso8 = recommendFood({ options: [plato({ id: 'sin-tiempo', price: 8, walkMinutes: 5, contains: { peanut: 'not_applicable' } })], profile: perfil, context: contexto });
    const caso9 = recommendFood({ options: [plato({ id: 'sin-precio', walkMinutes: 5, waitMinutes: 5, contains: { peanut: 'not_applicable' } })], profile: perfil, context: contexto });
    const caso10a = recommendFood({ options: rankingOptions, profile: perfil, context: contexto });
    const caso10b = recommendFood({ options: rankingOptions, profile: perfil, context: contexto });

    const checks = [
      ['1 · eligible dentro de precio y tiempo', caso1.recommendations.length === 1 && caso1.recommendations[0].opcion.id === 'seguro' && caso1.recommendations[0].completa],
      ['2 · excluded de HU-07 no entra', evaluateCompatibility(perfil, excludedDish).status === 'excluded' && caso2.recommendations.length === 0],
      ['3 · warning se conserva', caso3.recommendations[0]?.compatibilidad.status === 'warning' && caso3.recommendations[0].compatibilidad.reasons.length > 0],
      ['4 · precio sobre presupuesto se excluye', caso4.recommendations.length === 0],
      ['5 · tiempo total 15 min es viable', caso5.recommendations[0]?.opcion.id === 'viable' && caso5.recommendations[0].razones.some((r) => r.includes('15 min'))],
      ['6 · tiempo total 25 min no es viable', caso6.recommendations.length === 0],
      ['7 · ranking determinístico y explicado', caso7.recommendations.map((r) => r.opcion.id).join(',') === 'A,B' && caso7.recommendations.every((r) => r.razones.length > 0)],
      ['8 · tiempo unknown no se asume cero', caso8.recommendations[0]?.completa === false && caso8.recommendations[0].razones.some((r) => r.includes('tiempo total'))],
      ['9 · precio unknown no se asume dentro', caso9.recommendations[0]?.completa === false && caso9.recommendations[0].razones.some((r) => r.includes('precio confirmado'))],
      ['10 · misma entrada produce mismo orden', caso10a.recommendations.map((r) => r.opcion.id).join(',') === caso10b.recommendations.map((r) => r.opcion.id).join(',')]
    ];
    const salida = document.querySelector('#salida');
    let pasadas = 0;
    for (const [nombre, ok] of checks) {
      if (ok) pasadas++;
      const li = document.createElement('li');
      li.textContent = `${ok ? 'OK' : 'FALLA'} · ${nombre}`;
      li.style.color = ok ? '#4ade80' : '#fca5a5';
      salida.append(li);
    }
    const resumen = document.querySelector('#resumen');
    resumen.textContent = `${pasadas}/${checks.length} casos correctos · excluidas: ${caso2.excluded + caso4.excluded + caso6.excluded}`;
    resumen.className = `resumen ${pasadas === checks.length ? 'verde' : 'rojo'}`;
  </script>
</body>
</html>
